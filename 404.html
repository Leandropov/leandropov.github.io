<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada | Leandro Bravo</title>
<!-- Rutas absolutas (con / delante) y no relativas: GitHub sirve esta misma
     página para cualquier dirección que no exista, incluida una del tipo
     /algo/otra/cosa. Con rutas relativas, ahí no encontraría ni el CSS. -->
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<!-- Las dos fuentes del primer pantallazo, pedidas ya: si no, el
     navegador no las descubre hasta haber leído style.css entero.
     `crossorigin` es obligatorio aunque sean del propio sitio: las
     fuentes siempre se piden en modo CORS y sin él se bajan dos veces. -->
<link rel="preload" href="/fonts/source-serif-4-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/inter-normal.woff2" as="font" type="font/woff2" crossorigin>
<meta name="robots" content="noindex">
</head>
<body class="theme-light">

<div class="guides" aria-hidden="true"></div>

<header class="site-header">
  <div class="container">
    <a href="/" data-en-href="/en/" class="logo">Leandro<span class="logo-last"> Bravo</span></a>
    <nav class="nav-toggle">
      <a href="/" data-en-href="/en/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span data-en="Work">Proyectos</span>
      </a>
      <a href="/about.html" data-en-href="/en/about.html">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <span data-en="About">Sobre mí</span>
      </a>
    </nav>
  </div>
  <div class="rule rule--header" aria-hidden="true"></div>
</header>

<main>
  <section class="hero">
    <div class="container hero-inner">
      <p class="eyebrow">Error 404</p>
      <h1 data-en="This page doesn't exist. What does exist is one click away.">Esta página no existe. Lo que sí existe está a un clic.</h1>
      <a class="btn-pill" href="/" data-en-href="/en/">
        <span data-en="See the projects">Ver los proyectos</span>
        <span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg></span>
      </a>
    </div>
  </section>

  <div class="rule" aria-hidden="true"></div>
</main>

<!-- GitHub sirve este mismo archivo para cualquier dirección que no exista,
     también las de /en/. Si la ruta rota es de la versión en inglés, cada
     elemento con `data-en` cambia su texto y cada uno con `data-en-href` su
     destino. -->
<script>
if (location.pathname.indexOf('/en/') === 0) {
  document.documentElement.lang = 'en';
  document.title = 'Page not found | Leandro Bravo';
  document.querySelectorAll('[data-en]').forEach(function (el) { el.textContent = el.dataset.en; });
  document.querySelectorAll('[data-en-href]').forEach(function (el) { el.setAttribute('href', el.dataset.enHref); });
}
</script>
</body>
</html>
